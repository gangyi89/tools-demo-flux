apiVersion: v1
kind: Namespace
metadata:
  name: redis
---
apiVersion: source.toolkit.fluxcd.io/v1beta1
kind: HelmRepository
metadata:
  name: redis-operator
  namespace: redis
spec:
  interval: 24h
  url: https://ot-container-kit.github.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: redis-operator
  namespace: redis
spec:
  interval: 5m
  chart:
    spec:
      chart: redis-operator
      version: '0.18.0'
      sourceRef:
        kind: HelmRepository
        name: redis-operator
        namespace: redis
      interval: 1m