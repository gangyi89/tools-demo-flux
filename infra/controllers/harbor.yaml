apiVersion: v1
kind: Namespace
metadata:
  name: harbor
---
apiVersion: source.toolkit.fluxcd.io/v1beta1
kind: HelmRepository
metadata:
  name: harbor-operator
  namespace: harbor
spec:
  interval: 24h
  url: https://helm.goharbor.io
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: harbor-operator
  namespace: harbor
spec:
  interval: 5m
  chart:
    spec:
      chart: harbor
      version: '1.14.3'
      sourceRef:
        kind: HelmRepository
        name: harbor-operator
        namespace: harbor
      interval: 1m
  values:
    harborAdminPassword: "admin"
    expose:
      type: ingress
      tls:
        enabled: true
        certSource: auto
      ingress:
        hosts:
          core: harbor.gangstack.com
        annotations:
          kubernetes.io/ingress.class: nginx
          cert-manager.io/cluster-issuer: "letsencrypt"
        tls:
          - hosts:
              - harbor.gangstack.com
    externalURL: https://harbor.gangstack.com