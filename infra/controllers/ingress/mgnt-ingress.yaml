---
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx-mgmt
  labels:
    toolkit.fluxcd.io/tenant: sre-team
---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: ingress-nginx-mgmt
  namespace: ingress-nginx-mgmt
spec:
  interval: 30m
  chart:
    spec:
      chart: ingress-nginx
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: ingress-nginx
      interval: 12h
  values:
    controller:
      ingressClassResource:
        name: nginx-mgmt
        enabled: true
        default: false
        controllerValue: "k8s.io/ingress-nginx-mgmt"
      ingressClass: "nginx-mgmt"
      service:
        type: "LoadBalancer"
    admissionWebhooks:
      enabled: false