apiVersion: source.toolkit.fluxcd.io/v1beta1
kind: HelmRepository
metadata:
  name: akhq
  namespace: kafka
spec:
  interval: 24h
  url: https://akhq.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: akhq
  namespace: kafka
spec:
  interval: 5m
  chart:
    spec:
      chart: akhq
      version: '0.25.1'
      sourceRef:
        kind: HelmRepository
        name: akhq
        namespace: kafka
      interval: 1m
  values:
    configuration:
      akhq:
        connections:
          local:
            properties:
              bootstrap.servers: "my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
    ingress:
      enabled: true
      ingressClassName: nginx-mgmt
      annotations:
        kubernetes.io/ingress.class: nginx-mgmt
        cert-manager.io/cluster-issuer: letsencrypt
        nginx.ingress.kubernetes.io/auth-type: basic
        nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required'
        nginx.ingress.kubernetes.io/auth-secret: akhq-auth
      hosts:
        - akhq.gangstack.com
      tls:
        - secretName: akhq-general-tls
          hosts:
            - akhq.gangstack.com