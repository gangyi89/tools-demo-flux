apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rook-ceph-mgr-dashboard
  namespace: rook-ceph
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: "nginx"
  hosts:
    - rook.gangstack.com
  tls:
    - secretName: rook-ceph-tls
      hosts:
        - rook.gangstack.com